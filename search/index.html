<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نکاح فارم تلاش کریں</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/earlyaccess/notonastaliqurdu.css');
    body {
      font-family: 'Noto Nastaliq Urdu', serif;
      background: #fefdf9;
      color: #333;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #064663;
    }
    input, button {
      padding: 12px;
      font-size: 1.1rem;
      margin: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 90%;
      max-width: 400px;
    }
    button {
      background-color: #0a9396;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #007f81;
    }
    .result {
      margin-top: 30px;
      text-align: right;
      background-color: #e0f7fa;
      padding: 20px;
      border-radius: 8px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .error {
      color: red;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>🔍 نکاح فارم تلاش کریں</h1>
  <p>اپنا فون نمبر درج کریں تاکہ متعلقہ نکاح فارم دکھایا جا سکے۔</p>

  <input type="text" id="phone" placeholder="فون نمبر درج کریں">
  <button onclick="searchRecord()">تلاش کریں</button>

  <div id="output" class="result"></div>
  <div id="error" class="error"></div>

  <script>
    async function searchRecord() {
      const phone = document.getElementById("phone").value.trim();
      const output = document.getElementById("output");
      const error = document.getElementById("error");
      output.innerHTML = "";
      error.innerHTML = "";

      if (phone === "") {
        error.textContent = "براہ کرم فون نمبر درج کریں۔";
        return;
      }

      try {
        const res = await fetch("https://script.google.com/macros/s/AKfycbzI854mXWFSKEfwmbV5SpTf8Xj5Xdhykb1yViGQY-IoMSsnNN_gtkjbMaDBz-wdztFI/exec");
        const data = await res.json();
        const record = data.find(row => row[9] === phone); // index 9 = دولہے کا فون نمبر

        if (record) {
          output.innerHTML = `
            <h2>🎉 نکاح فارم کی تفصیل</h2>
            <p><strong>نکاح کی جگہ:</strong> ${record[0]}</p>
            <p><strong>تاریخ:</strong> ${record[1]}</p>
            <p><strong>دولہا:</strong> ${record[2]} بن ${record[3]}</p>
            <p><strong>عمر:</strong> ${record[4]}, پیشہ: ${record[5]}</p>
            <p><strong>پتہ:</strong> ${record[6]}</p>
            <p><strong>آدھار:</strong> ${record[7]}</p>
            <p><strong>فون:</strong> ${record[8]}</p>
            <hr>
            <p><strong>دلہن:</strong> ${record[9]} بنت ${record[10]}</p>
            <p><strong>عمر:</strong> ${record[11]}, پیشہ: ${record[12]}</p>
            <p><strong>پتہ:</strong> ${record[13]}</p>
            <p><strong>آدھار:</strong> ${record[14]}</p>
            <hr>
            <p><strong>وکیل:</strong> ${record[15]} بن ${record[16]}</p>
            <p><strong>گواہ 1:</strong> ${record[17]} بن ${record[18]}</p>
            <p><strong>گواہ 2:</strong> ${record[19]} بن ${record[20]}</p>
            <p><strong>مہر:</strong> ${record[21]}</p>
            <p><strong>قاری النکاح:</strong> ${record[22]}</p>
          `;
        } else {
          error.textContent = "کوئی ریکارڈ نہیں ملا۔";
        }
      } catch (err) {
        console.error(err);
        error.textContent = "تلاش کے دوران خرابی ہوئی۔";
      }
    }
  </script>
</body>
</html>
