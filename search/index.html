<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نکاح فارم تلاش کریں</title>
  <style>
    body {
      font-family: 'Noto Nastaliq Urdu', serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #064663;
    }
    form {
      max-width: 800px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.05);
    }
    label {
      display: block;
      margin-top: 15px;
      font-size: 1.1rem;
      color: #333;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 5px;
    }
    button {
      background-color: #0a9396;
      color: white;
      border: none;
      margin-top: 25px;
      padding: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #007f81;
    }
    #result {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #064663;
    }
  </style>
</head>
<body>
  <h2>🔍 نکاح فارم تلاش کریں</h2>
  
  <form id="searchForm">
    <label>اپنا فون نمبر درج کریں:</label>
    <input type="text" id="phoneInput" required>
    <button type="submit">تلاش کریں</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById('searchForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // فون نمبر حاصل کریں
      var phone = document.getElementById('phoneInput').value;

      // Google Apps Script Web App URL
      var url = "https://script.google.com/macros/s/AKfycbzI854mXWFSKEfwmbV5SpTf8Xj5Xdhykb1yViGQY-loMSsnNN_gtkjbMaDBz-wdztFI/exec?phone=" + encodeURIComponent(phone);

      // Web App سے ڈیٹا حاصل کریں
      fetch(url)
        .then(response => response.text()) // JSON ڈیٹا وصول کریں
        .then(text => {
          if (text === "not_found") {
            document.getElementById('result').innerText = "ریکارڈ نہیں ملا";
          } else {
            const data = JSON.parse(text); // JSON ڈیٹا کو parse کریں
            let resultHTML = "<h3>نکاح فارم کی تفصیل:</h3><ul>";
            for (let key in data) {
              resultHTML += `<li><strong>${key}:</strong> ${data[key]}</li>`;
            }
            resultHTML += "</ul>";
            document.getElementById('result').innerHTML = resultHTML; // نتیجہ دکھائیں
          }
        });
    });
  </script>
</body>
</html>
