<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نکاح فارم اندراج - نوری دارالقضاءت</title>
  <style>
    @import url('https://fonts.googleapis.com/earlyaccess/notonastaliqurdu.css');
    body {
      font-family: 'Noto Nastaliq Urdu', serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #064663;
      margin-bottom: 30px;
    }
    form {
      max-width: 800px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.05);
    }
    label {
      display: block;
      margin-top: 15px;
      font-size: 1.1rem;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 5px;
    }
    input[type="submit"] {
      background-color: #0a9396;
      color: white;
      border: none;
      margin-top: 25px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    input[type="submit"]:hover {
      background-color: #007f81;
    }
    .success {
      text-align: center;
      color: green;
      margin-top: 20px;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h2>🔹 نکاح فارم اندراج 🔹</h2>
  <form id="nikahForm">
    <label>1. جائے نکاح</label>
    <input type="text" name="جائے نکاح" required>

    <label>2. نکاح کی تاریخ</label>
    <input type="date" name="نکاح کی تاریخ" required>

    <label>3. دولہا کا نام</label>
    <input type="text" name="دولہا کا نام" required>

    <label>4. دولہے کے والد کا نام</label>
    <input type="text" name="دولہے کے والد کا نام" required>

    <label>5. دلہے کی عمر</label>
    <input type="number" name="دلہے کی عمر" required>

    <label>6. دولہا کا پیشہ</label>
    <input type="text" name="دولہا کا پیشہ" required>

    <label>7. دولہا کا پتہ</label>
    <textarea name="دولہا کا پتہ" rows="2" required></textarea>

    <label>8. دلہے کا آدھار نمبر</label>
    <input type="text" name="دلہے کا آدھار نمبر" required>

    <label>9. دولہے کا فون نمبر</label>
    <input type="tel" name="دولہے کا فون نمبر" required>

    <label>10. دلہن کا نام</label>
    <input type="text" name="دلہن کا نام" required>

    <label>11. دلہن کے والد کا نام</label>
    <input type="text" name="دلہن کے والد کا نام" required>

    <label>12. دلہن کی عمر</label>
    <input type="number" name="دلہن کی عمر" required>

    <label>13. دلہن کا پیشہ</label>
    <input type="text" name="دلہن کا پیشہ" required>

    <label>14. دلہن کا پتہ</label>
    <textarea name="دلہن کا پتہ" rows="2" required></textarea>

    <label>15. دلہن کا آدھار نمبر</label>
    <input type="text" name="دلہن کا آدھار نمبر" required>

    <label>16. وکیل کا نام</label>
    <input type="text" name="وکیل کا نام" required>

    <label>17. وکیل کے والد کا نام</label>
    <input type="text" name="وکیل کے والد کا نام" required>

    <label>18. گواہ اول کا نام</label>
    <input type="text" name="گواہ اول کا نام" required>

    <label>19. گواہ اول کے والد کا نام</label>
    <input type="text" name="گواہ اول کے والد کا نام" required>

    <label>20. گواہ دوم کا نام</label>
    <input type="text" name="گواہ دوم کا نام" required>

    <label>21. گواہ دوم کے والد کا نام</label>
    <input type="text" name="گواہ دوم کے والد کا نام" required>

    <label>22. مہر کی رقم</label>
    <input type="text" name="مہر کی رقم" required>

    <label>23. قاری النکاح کا نام</label>
    <input type="text" name="قاری النکاح کا نام" required>

    <input type="submit" value="📥 فارم جمع کریں">
  </form>

  <div class="success" id="successMsg" style="display:none;">
    ✅ فارم کامیابی سے جمع ہو چکا ہے۔ شکریہ!
  </div>

  <script>
    const form = document.getElementById('nikahForm');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const formData = new FormData(form);
      const data = {};
      formData.forEach((value, key) => {
        data[key] = value;
      });

      // Google Apps Script Web App URL
      fetch("https://script.google.com/macros/s/AKfycbzI854mXWFSKEfwmbV5SpTf8Xj5Xdhykb1yViGQY-loMSsnNN_gtkjbMaDBz-wdztFI/exec", {
        method: "POST",
        body: JSON.stringify(data),
        headers: { "Content-Type": "application/json" },
      })
      .then(res => res.json())
      .then(response => {
        console.log(response);
        if (response.result === "success") {
          form.reset();
          successMsg.style.display = "block";
        } else {
          alert("❌ فارم جمع کرنے میں خرابی ہوئی: دوبارہ کوشش کریں");
        }
      })
      .catch(err => {
        console.error(err);
        alert("⚠️ سرور سے رابطہ نہ ہو سکا");
      });
    });
  </script>
</body>
</html>
