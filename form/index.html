<!DOCTYPE html><html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نکاح فارم اندراج</title>
  <style>
    body {
      font-family: 'Noto Nastaliq Urdu', serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 20px;
      direction: rtl;
      text-align: right;
    }
    h1 {
      text-align: center;
      color: #064663;
    }
    form {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
    }
    button {
      margin-top: 20px;
      background-color: #0a9396;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #007f81;
    }
  </style>
</head>
<body>
  <h1>نکاح فارم اندراج</h1>
  <form id="nikahForm">
    <label for="location">جائے نکاح:</label>
    <input type="text" id="location" name="location" required><label for="date">نکاح کی تاریخ:</label>
<input type="date" id="date" name="date" required>

<label for="groomName">دولہا کا نام:</label>
<input type="text" id="groomName" name="groomName" required>

<label for="groomFather">دولہے کے والد کا نام:</label>
<input type="text" id="groomFather" name="groomFather" required>

<label for="groomAge">دولہے کی عمر:</label>
<input type="number" id="groomAge" name="groomAge" required>

<label for="groomJob">دولہا کا پیشہ:</label>
<input type="text" id="groomJob" name="groomJob" required>

<label for="groomAddress">دولہا کا پتہ:</label>
<input type="text" id="groomAddress" name="groomAddress" required>

<label for="groomPhone">دولہے کا فون نمبر:</label>
<input type="tel" id="groomPhone" name="groomPhone" required>

<label for="brideName">دلہن کا نام:</label>
<input type="text" id="brideName" name="brideName" required>

<label for="brideFather">دلہن کے والد کا نام:</label>
<input type="text" id="brideFather" name="brideFather" required>

<label for="brideAge">دلہن کی عمر:</label>
<input type="number" id="brideAge" name="brideAge" required>

<label for="brideJob">دلہن کا پیشہ:</label>
<input type="text" id="brideJob" name="brideJob" required>

<label for="brideAddress">دلہن کا پتہ:</label>
<input type="text" id="brideAddress" name="brideAddress" required>

<label for="mehr">مہر کی رقم:</label>
<input type="text" id="mehr" name="mehr" required>

<label for="vakilName">وکیل کا نام:</label>
<input type="text" id="vakilName" name="vakilName" required>

<label for="vakilFather">وکیل کے والد کا نام:</label>
<input type="text" id="vakilFather" name="vakilFather" required>

<label for="witness1">گواہ اول کا نام:</label>
<input type="text" id="witness1" name="witness1" required>

<label for="witness1Father">گواہ اول کے والد کا نام:</label>
<input type="text" id="witness1Father" name="witness1Father" required>

<label for="witness2">گواہ دوم کا نام:</label>
<input type="text" id="witness2" name="witness2" required>

<label for="witness2Father">گواہ دوم کے والد کا نام:</label>
<input type="text" id="witness2Father" name="witness2Father" required>

<label for="qazi">قاری النکاح کا نام:</label>
<input type="text" id="qazi" name="qazi" required>

<button type="submit">فارم جمع کریں</button>

  </form>  <script>
    document.getElementById("nikahForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      fetch("https://script.google.com/macros/s/AKfycbzl854mXWFSKEfwmbV5SpTf8Xj5Xdhykb1yViGQY-loMSsnNN_gtkjbMaDBz-wdztFI/exec", {
        method: "POST",
        body: formData
      })
      .then(response => alert("فارم کامیابی سے جمع ہو گیا!"))
      .catch(error => alert("کچھ خرابی ہوئی، دوبارہ کوشش کریں."));
    });
  </script></body>
</html>
